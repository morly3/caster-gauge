<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>簡易アライメントゲージ用記録ツール v0.3.2</title>
  <style>
    :root {
      --bg: #000;
      --ink: #101820;
      --muted: #6b7280;
      --blue: #4b7fd3;
      --green: #55d6a7;
      --memo: #add391;
      --ok: #02b95d;
      --danger: #f20d16;
      --line: #d7e0ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #e8e8e8;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .app {
      width: min(100%, 470px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 12px;
      background: var(--bg);
      border-left: 2px solid #222;
      border-right: 2px solid #222;
    }
    header {
      padding: 10px 4px 12px;
      border-bottom: 2px solid #66717d;
    }
    h1 {
      margin: 0;
      font-size: clamp(17px, 4.8vw, 22px);
      line-height: 1.25;
      letter-spacing: 0;
    }
    h1 a {
      color: #fff;
      text-decoration: underline;
      text-decoration-color: #e94343;
      text-underline-offset: 4px;
    }
    .date {
      margin: 12px 0;
      color: #cfd4da;
      font-size: 16px;
    }
    .actions, .bottom-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 12px 0 16px;
    }
    .btn {
      width: 100%;
      min-height: 44px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: #111;
      font-weight: 800;
      padding: 8px 10px;
      box-shadow: 0 2px 0 rgba(255,255,255,.25) inset, 0 2px 7px rgba(0,0,0,.35);
    }
    .btn.primary { border-color: #2f73ff; }
    .band {
      margin: 8px 0;
      padding: 8px;
      border: 3px solid #2d67bd;
      border-radius: 10px;
      background: var(--blue);
    }
    .band.caster { background: var(--green); border-color: #64dfb9; }
    .row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(96px, 1.05fr) minmax(0, 1fr);
      gap: 8px;
      align-items: stretch;
    }
    .toe-row {
      grid-template-columns: minmax(0, .88fr) minmax(148px, 1.32fr) minmax(0, .88fr);
    }
    .stack {
      display: grid;
      gap: 12px;
      align-content: start;
    }
    .toe-row .stack { gap: 22px; }
    .toe-spacer {
      display: none;
    }
    .cell[data-key$="Pressure"] {
      width: 78%;
      justify-self: center;
    }
    .cell[data-key$="Pressure"].pressure-empty { background: #ffd6e7; }
    .cell[data-key$="Pressure"].pressure-filled { background: #cfefff; }
    .cell {
      min-height: 78px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: #111;
      padding: 7px 5px;
      text-align: center;
      display: grid;
      align-content: center;
      gap: 2px;
    }
    .cell-title {
      font-size: 13px;
      font-weight: 900;
      line-height: 1.2;
    }
    .cell-main {
      color: var(--ok);
      font-size: 21px;
      font-weight: 900;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }
    .cell-main.negative { color: var(--danger); }
    .cell-sub {
      color: #111;
      font-size: 15px;
      font-weight: 850;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }
    .cell-sub.muted { color: #777; font-size: 13px; }
    .axle {
      min-height: 106px;
      position: relative;
      color: #111;
      display: grid;
      place-items: center;
      text-align: center;
      font-weight: 900;
      overflow: hidden;
    }
    .bar {
      position: absolute;
      top: 18px;
      left: 18%;
      right: 18%;
      height: 26px;
      border-radius: 6px;
      background: #8e8e8a;
    }
    .wheel {
      position: absolute;
      top: 30px;
      width: 20px;
      height: 54px;
      border-radius: 7px;
      background: #111827;
      transform-origin: center;
      transition: transform .18s ease;
    }
    .wheel.left { left: 10%; transform: rotate(var(--left-camber-angle, 0deg)); }
    .wheel.right { right: 10%; transform: rotate(var(--right-camber-angle, 0deg)); }
    .axle-label { position: relative; z-index: 1; font-size: 22px; }
    .front-camber-axle .axle-label { transform: translateY(6px); }
    .rear-camber-axle .axle-label { transform: translateY(6px); }
    .caster-icon {
      position: relative;
      width: 128px;
      height: 126px;
      z-index: 1;
    }
    .caster-disc {
      position: absolute;
      right: 8px;
      bottom: 2px;
      width: 100px;
      height: 100px;
      border: 7px solid #fff;
      border-radius: 50%;
      background: #000;
      z-index: 1;
    }
    .caster-gauge {
      position: absolute;
      left: 28px;
      top: -12px;
      width: 40px;
      height: 116px;
      border: 7px solid #fff;
      border-radius: 10px;
      background: #000;
      transform: rotate(-20deg);
      transform-origin: center;
      box-shadow: 0 0 0 1px rgba(0,0,0,.05);
      z-index: 2;
    }
    .side-diff {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      font-size: 14px;
    }
    .front-camber-axle .side-diff { bottom: 2px; }
    .rear-camber-axle .side-diff { bottom: 2px; }
    .toe-center {
      min-height: 0;
      border: 2px solid #09b66a;
      border-radius: 5px;
      background: #fff;
      color: #111;
      padding: 8px 4px;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 8px;
      align-items: center;
      align-self: start;
    }
    .toe-summary {
      text-align: center;
      font-weight: 900;
      line-height: 1.25;
      min-height: 78px;
      display: grid;
      align-content: center;
    }
    .toe-summary .label {
      color: #111;
      font-size: 16px;
      font-weight: 500;
    }
    .toe-summary .total-value {
      color: var(--ok);
      font-size: 25px;
    }
    .toe-summary .converted-value {
      color: #111;
      font-size: 18px;
    }
    .toe-summary .unit {
      font-size: .78em;
    }
    .toe-summary.rear-summary {
      transform: translateY(-120px);
      margin-bottom: -120px;
    }
    .toe-svg {
      display: block;
      width: 100%;
      height: 340px;
      overflow: visible;
      transform: translateY(-40px);
    }
    .toe-svg text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-anchor: middle;
      font-weight: 900;
    }
    .toe-wheel {
      transform-box: fill-box;
      transform-origin: center;
      transition: transform .18s ease;
    }
    .memo-label {
      margin: 16px 0 8px;
      color: #d8d8d8;
      font-size: 14px;
    }
    textarea {
      width: 100%;
      min-height: 86px;
      resize: vertical;
      border: 2px solid #b9d8ae;
      border-radius: 8px;
      background: var(--memo);
      color: #102012;
      padding: 11px;
      font-size: 18px;
      line-height: 1.35;
      user-select: text;
      -webkit-user-select: text;
    }
    dialog {
      width: min(92vw, 520px);
      border: 0;
      border-radius: 14px;
      padding: 0;
      box-shadow: 0 18px 54px rgba(0,0,0,.4);
    }
    dialog::backdrop { background: rgba(0,0,0,.58); }
    .modal {
      background: #fff;
      color: #111;
      padding: 18px;
    }
    .modal h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }
    .form { display: grid; gap: 12px; }
    label span {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      font-weight: 850;
    }
    .diameter-readout {
      border: 1px solid #cdd6e2;
      border-radius: 8px;
      background: #f4f7fb;
      color: #111;
      padding: 10px 12px;
    }
    .diameter-readout span {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 850;
    }
    .diameter-readout b {
      font-size: 18px;
      line-height: 1.2;
    }
    input, select {
      width: 100%;
      min-height: 42px;
      border: 1px solid #cdd6e2;
      border-radius: 8px;
      background: #fff;
      color: #111;
      padding: 8px 10px;
      user-select: text;
      -webkit-user-select: text;
    }
    .seg, .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .modal-actions.list-actions { grid-template-columns: 1fr 1fr 1fr; }
    .seg.is-hidden { display: none; }
    .seg .active { background: var(--green); }
    .nudge {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .history-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #d6dde6;
    }
    .history-row small { color: var(--muted); }
    .file-input {
      display: none;
    }
    @media (max-width: 430px) {
      .app { padding: 10px 8px; }
      .row { gap: 5px; grid-template-columns: minmax(0, 1fr) minmax(86px, .95fr) minmax(0, 1fr); }
      .toe-row { grid-template-columns: minmax(0, .78fr) minmax(138px, 1.45fr) minmax(0, .78fr); }
      .cell { padding: 6px 3px; }
      .cell-title { font-size: 12px; }
      .cell-main { font-size: 18px; }
      .cell-sub { font-size: 13px; }
      .toe-row .cell-title { font-size: 11px; }
      .toe-row .cell-main { font-size: 16px; }
      .toe-row .cell-sub { font-size: 12px; }
      .toe-center { min-height: 0; }
      .toe-summary { min-height: 74px; }
      .toe-summary .label { font-size: 14px; }
      .toe-summary .total-value { font-size: 21px; }
      .toe-summary .converted-value { font-size: 16px; }
      .toe-summary.rear-summary {
        transform: translateY(-112px);
        margin-bottom: -112px;
      }
      .toe-svg {
        height: 330px;
        transform: translateY(-36px);
      }
      .btn { min-height: 40px; }
      .caster-icon { transform: scale(.72); }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1><a href="https://note.com/mk_morly/n/na2ac85d692a2" target="_blank" rel="noopener noreferrer">アライメントゲージの説明はこちら</a> v 0.3.3</h1>
    </header>

    <div class="date">
      <div>計測開始　<span id="measuredAt"></span></div>
      <div>最終更新　<span id="updatedAt"></span></div>
    </div>
    <section class="actions">
      <button class="btn primary" id="newBtn">新規開始</button>
      <button class="btn" id="settingsBtn">タイヤサイズ設定</button>
    </section>

    <section class="band caster">
      <div class="row">
        <button class="cell" data-key="flCaster"><span class="cell-title">FL キャスター</span><span class="cell-main" id="flCasterMain">--</span><span class="cell-sub muted" id="flCasterSub">未測定</span></button>
        <div class="axle"><div class="caster-icon"><div class="caster-disc"></div><div class="caster-gauge"></div></div></div>
        <button class="cell" data-key="frCaster"><span class="cell-title">FR キャスター</span><span class="cell-main" id="frCasterMain">--</span><span class="cell-sub muted" id="frCasterSub">未測定</span></button>
      </div>
    </section>

    <section class="band">
      <div class="row">
        <button class="cell" data-key="flCamber"><span class="cell-title">FL キャンバー</span><span class="cell-main" id="flCamberMain">--</span><span class="cell-sub" id="flCamberSub">換算 --</span></button>
        <div class="axle front-camber-axle"><div class="bar"></div><div class="wheel left"></div><div class="wheel right"></div><div class="axle-label">Front</div><div class="side-diff">左右差 <b id="frontCamberDiff">--</b></div></div>
        <button class="cell" data-key="frCamber"><span class="cell-title">FR キャンバー</span><span class="cell-main" id="frCamberMain">--</span><span class="cell-sub" id="frCamberSub">換算 --</span></button>
      </div>
    </section>

    <section class="band">
      <div class="row">
        <div class="stack">
          <button class="cell" data-key="flToe"><span class="cell-title">FL トー</span><span class="cell-main" id="flToeMain">--</span><span class="cell-sub" id="flToeSub">換算 --</span></button>
          <button class="cell" data-key="flPressure"><span class="cell-title">FL タイヤ空気圧</span><span class="cell-main" id="flPressureMain">--</span></button>
          <button class="cell" data-key="leftWheelbase"><span class="cell-title">L ホイールベース</span><span class="cell-main" id="leftWheelbaseMain">--</span></button>
          <button class="cell" data-key="rlPressure"><span class="cell-title">RL タイヤ空気圧</span><span class="cell-main" id="rlPressureMain">--</span></button>
          <div class="toe-spacer" aria-hidden="true"></div>
          <button class="cell" data-key="rlToe"><span class="cell-title">RL トー</span><span class="cell-main" id="rlToeMain">--</span><span class="cell-sub" id="rlToeSub">換算 --</span></button>
        </div>
        <div class="toe-center">
          <div class="toe-summary">
            <div class="label">トータルトー</div>
            <div class="total-value" id="frontTotalToe">--</div>
            <div class="converted-value" id="frontTotalToeSub">換算 --</div>
          </div>
          <svg class="toe-svg" viewBox="0 0 180 360" role="img" aria-label="トーとホイールベースの図">
            <g class="toe-wheel" id="flToeWheel">
              <rect x="6" y="44" width="40" height="84" rx="9" fill="#000"></rect>
              <line x1="6" y1="86" x2="46" y2="86" stroke="#fff" stroke-width="2" stroke-dasharray="2 2"></line>
            </g>
            <g class="toe-wheel" id="frToeWheel">
              <rect x="134" y="44" width="40" height="84" rx="9" fill="#000"></rect>
              <line x1="134" y1="86" x2="174" y2="86" stroke="#fff" stroke-width="2" stroke-dasharray="2 2"></line>
            </g>

            <text x="90" y="26" font-size="24" fill="#111">Front</text>
            <path d="M90 38 L60 70 H76 V122 H104 V70 H120 Z" fill="#fff" stroke="#17284e" stroke-width="5"></path>

            <text x="90" y="154" font-size="18" fill="#111">ホイールベース</text>
            <text x="90" y="182" font-size="20" fill="#111">左右差 <tspan id="wheelbaseDiff">--</tspan></text>

            <g class="toe-wheel" id="rlToeWheel">
              <rect x="6" y="222" width="40" height="84" rx="9" fill="#101827"></rect>
              <line x1="6" y1="264" x2="46" y2="264" stroke="#fff" stroke-width="2" stroke-dasharray="2 2"></line>
            </g>
            <g class="toe-wheel" id="rrToeWheel">
              <rect x="134" y="222" width="40" height="84" rx="9" fill="#101827"></rect>
              <line x1="134" y1="264" x2="174" y2="264" stroke="#fff" stroke-width="2" stroke-dasharray="2 2"></line>
            </g>
            <text x="90" y="296" font-size="24" fill="#111">Rear</text>
          </svg>
          <div class="toe-summary rear-summary">
            <div class="label">トータルトー</div>
            <div class="total-value" id="rearTotalToe">--</div>
            <div class="converted-value" id="rearTotalToeSub">換算 --</div>
          </div>
        </div>
        <div class="stack">
          <button class="cell" data-key="frToe"><span class="cell-title">FR トー</span><span class="cell-main" id="frToeMain">--</span><span class="cell-sub" id="frToeSub">換算 --</span></button>
          <button class="cell" data-key="frPressure"><span class="cell-title">FR タイヤ空気圧</span><span class="cell-main" id="frPressureMain">--</span></button>
          <button class="cell" data-key="rightWheelbase"><span class="cell-title">R ホイールベース</span><span class="cell-main" id="rightWheelbaseMain">--</span></button>
          <button class="cell" data-key="rrPressure"><span class="cell-title">RR タイヤ空気圧</span><span class="cell-main" id="rrPressureMain">--</span></button>
          <div class="toe-spacer" aria-hidden="true"></div>
          <button class="cell" data-key="rrToe"><span class="cell-title">RR トー</span><span class="cell-main" id="rrToeMain">--</span><span class="cell-sub" id="rrToeSub">換算 --</span></button>
        </div>
      </div>
    </section>

    <section class="band">
      <div class="row">
        <button class="cell" data-key="rlCamber"><span class="cell-title">RL キャンバー</span><span class="cell-main" id="rlCamberMain">--</span><span class="cell-sub" id="rlCamberSub">換算 --</span></button>
        <div class="axle rear-camber-axle"><div class="bar"></div><div class="wheel left"></div><div class="wheel right"></div><div class="axle-label">Rear</div><div class="side-diff">左右差 <b id="rearCamberDiff">--</b></div></div>
        <button class="cell" data-key="rrCamber"><span class="cell-title">RR キャンバー</span><span class="cell-main" id="rrCamberMain">--</span><span class="cell-sub" id="rrCamberSub">換算 --</span></button>
      </div>
    </section>

    <div class="memo-label">メモ</div>
    <textarea id="memo" placeholder="車両名、タイヤ空気圧、路面、積載状態、調整内容、走行フィーリングなど"></textarea>
    <section class="bottom-actions">
      <button class="btn primary" id="saveBtn">測定結果を保存</button>
      <button class="btn" id="listBtn">リスト</button>
    </section>
  </main>

  <dialog id="inputDialog"><div class="modal">
    <h2 id="inputTitle"></h2>
    <div class="form">
      <div class="seg is-hidden" id="valueDir">
        <button class="btn" data-dir="negative">Out</button>
        <button class="btn" data-dir="positive">In</button>
      </div>
      <label><span id="inputLabel">値</span><input id="inputValue" type="number" inputmode="decimal" step="0.1"></label>
      <div class="nudge"><button class="btn" data-nudge="-1">-1.0</button><button class="btn" data-nudge="-0.1">-0.1</button><button class="btn" data-nudge="0.1">+0.1</button><button class="btn" data-nudge="1">+1.0</button></div>
    </div>
    <div class="modal-actions" style="margin-top:16px"><button class="btn" id="cancelInput">キャンセル</button><button class="btn primary" id="applyInput">反映</button></div>
  </div></dialog>

  <dialog id="settingsDialog"><div class="modal">
    <h2>タイヤサイズ設定</h2>
    <div class="form">
      <label><span>トー換算表示</span><select id="toeUnit"><option value="mm">ミリ</option><option value="deg">度分</option></select></label>
      <label><span>フロント 幅</span><input id="frontWidth" type="text" inputmode="numeric" pattern="[0-9]*"></label>
      <label><span>フロント 扁平率</span><input id="frontAspect" type="text" inputmode="numeric" pattern="[0-9]*"></label>
      <label><span>フロント ホイールリム外径</span><input id="frontRim" type="text" inputmode="numeric" pattern="[0-9]*"></label>
      <div class="diameter-readout"><span>フロントタイヤの外径</span><b id="frontDiameter">--</b></div>
      <label><span>リア 幅</span><input id="rearWidth" type="text" inputmode="numeric" pattern="[0-9]*"></label>
      <label><span>リア 扁平率</span><input id="rearAspect" type="text" inputmode="numeric" pattern="[0-9]*"></label>
      <label><span>リア ホイールリム外径</span><input id="rearRim" type="text" inputmode="numeric" pattern="[0-9]*"></label>
      <div class="diameter-readout"><span>リアタイヤの外径</span><b id="rearDiameter">--</b></div>
    </div>
    <div class="modal-actions" style="margin-top:16px"><button class="btn" id="cancelSettings">キャンセル</button><button class="btn primary" id="applySettings">保存</button></div>
  </div></dialog>

  <dialog id="listDialog"><div class="modal">
    <h2>リスト</h2>
    <div id="history"></div>
    <input class="file-input" id="importCsvFile" type="file" accept=".csv,text/csv">
    <div class="modal-actions list-actions" style="margin-top:16px"><button class="btn" id="closeList">閉じる</button><button class="btn" id="importCsv">CSVインポート</button><button class="btn primary" id="exportCsv">CSVエクスポート</button></div>
  </div></dialog>

  <script>
    const DB_NAME = "simple-alignment-gauge";
    const STORE_NAME = "records";
    const DRAFT_KEY = "casterGaugeDraft";
    const GAUGE_LENGTH = 300;
    const MEMO_TEMPLATE = `車両名：
調整内容：
結果：`;
    const fields = {
      flCaster: { label: "FL キャスター", unit: "deg", caster: true },
      frCaster: { label: "FR キャスター", unit: "deg", caster: true },
      flCamber: { label: "FL キャンバー", unit: "mm", camber: true },
      frCamber: { label: "FR キャンバー", unit: "mm", camber: true },
      rlCamber: { label: "RL キャンバー", unit: "mm", camber: true },
      rrCamber: { label: "RR キャンバー", unit: "mm", camber: true },
      flToe: { label: "FL トー", unit: "mm", toe: true, axle: "front" },
      frToe: { label: "FR トー", unit: "mm", toe: true, axle: "front" },
      rlToe: { label: "RL トー", unit: "mm", toe: true, axle: "rear" },
      rrToe: { label: "RR トー", unit: "mm", toe: true, axle: "rear" },
      flPressure: { label: "FL タイヤ空気圧", unit: "kPa", pressure: true },
      frPressure: { label: "FR タイヤ空気圧", unit: "kPa", pressure: true },
      rlPressure: { label: "RL タイヤ空気圧", unit: "kPa", pressure: true },
      rrPressure: { label: "RR タイヤ空気圧", unit: "kPa", pressure: true },
      leftWheelbase: { label: "L ホイールベース", unit: "mm" },
      rightWheelbase: { label: "R ホイールベース", unit: "mm" }
    };
    const state = {
      id: crypto.randomUUID(),
      measuredAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      settings: {
        toeUnit: "mm",
        front: { width: 255, aspect: 35, rim: 18 },
        rear: { width: 255, aspect: 35, rim: 18 }
      },
      values: {},
      memo: MEMO_TEMPLATE
    };
    let editingKey = null;
    let currentValueDir = "positive";
    const $ = (id) => document.getElementById(id);
    const MAX_VISUAL_ANGLE = 30;
    const MAX_CAMBER_CONVERTED_DEG = 7;
    const MAX_TOE_CONVERTED_MM = 15;

    function tireDiameter(axle) {
      const s = state.settings[axle];
      return s.width * s.aspect / 100 * 2 + s.rim * 25.4;
    }
    function mm(value, digits = 1) {
      return Number.isFinite(value) ? `${value.toFixed(digits)}mm` : "--";
    }
    function degMin(value) {
      if (!Number.isFinite(value)) return "--";
      const sign = value < 0 ? "-" : "";
      const abs = Math.abs(value);
      const deg = Math.floor(abs);
      const min = Math.round((abs - deg) * 60);
      return `${sign}${deg}° ${String(min).padStart(2, "0")}'`;
    }
    function camberText(value) {
      return degMin(Math.atan(value / GAUGE_LENGTH) * 180 / Math.PI);
    }
    function toeConverted(value, axle) {
      if (!Number.isFinite(value)) return "換算 --";
      if (state.settings.toeUnit === "deg") return `換算 ${degMin(Math.atan(value / GAUGE_LENGTH) * 180 / Math.PI)}`;
      return `換算 ${mm(value * tireDiameter(axle) / GAUGE_LENGTH)}`;
    }
    function toeText(value) {
      if (!Number.isFinite(value)) return "--";
      if (value === 0) return "0.0mm";
      return `${value > 0 ? "In" : "Out"} ${Math.abs(value).toFixed(1)} mm`;
    }
    function smallToeUnit(text) {
      return text.replace(/ ?mm/g, ' <span class="unit">mm</span>');
    }
    function val(key) {
      const value = state.values[key]?.value;
      return Number.isFinite(value) ? value : NaN;
    }
    function setMain(key, text, negative = false) {
      const el = $(`${key}Main`);
      el.textContent = text;
      el.className = `cell-main${negative ? " negative" : ""}`;
    }
    function render() {
      $("measuredAt").textContent = new Date(state.measuredAt).toLocaleString("ja-JP", { dateStyle: "short", timeStyle: "short" });
      $("updatedAt").textContent = new Date(state.updatedAt || state.measuredAt).toLocaleString("ja-JP", { dateStyle: "short", timeStyle: "short" });
      $("memo").value = state.memo;
      Object.keys(fields).forEach((key) => {
        const meta = fields[key];
        const value = val(key);
        const cell = document.querySelector(`[data-key="${key}"]`);
        if (meta.pressure && cell) {
          cell.classList.toggle("pressure-empty", !Number.isFinite(value));
          cell.classList.toggle("pressure-filled", Number.isFinite(value));
        }
        if (!Number.isFinite(value)) {
          setMain(key, "--");
          const sub = $(`${key}Sub`);
          if (sub) sub.textContent = meta.caster ? "未測定" : meta.camber || meta.toe ? "換算 --" : "";
          return;
        }
        if (meta.caster) {
          setMain(key, `${value.toFixed(2)}°`);
          $(`${key}Sub`).textContent = state.values[key].meta || "手入力";
        } else if (meta.camber) {
          setMain(key, mm(value), value < 0);
          $(`${key}Sub`).textContent = `換算 ${camberText(value)}`;
        } else if (meta.toe) {
          setMain(key, toeText(value), value < 0);
          $(`${key}Sub`).textContent = toeConverted(value, meta.axle);
        } else if (meta.pressure) {
          setMain(key, `${value.toFixed(0)} kPa`);
        } else {
          setMain(key, mm(value, 0));
        }
      });
      renderTotals();
    }
    function renderTotals() {
      const frontToe = val("flToe") + val("frToe");
      const rearToe = val("rlToe") + val("rrToe");
      setTotal("frontTotalToe", "frontTotalToeSub", frontToe, "front");
      setTotal("rearTotalToe", "rearTotalToeSub", rearToe, "rear");
      $("frontCamberDiff").textContent = Number.isFinite(val("flCamber") - val("frCamber")) ? camberText(val("flCamber") - val("frCamber")) : "--";
      $("rearCamberDiff").textContent = Number.isFinite(val("rlCamber") - val("rrCamber")) ? camberText(val("rlCamber") - val("rrCamber")) : "--";
      $("wheelbaseDiff").textContent = Number.isFinite(val("leftWheelbase") - val("rightWheelbase")) ? mm(val("leftWheelbase") - val("rightWheelbase"), 0) : "--";
      updateCamberAxle("front", val("flCamber"), val("frCamber"));
      updateCamberAxle("rear", val("rlCamber"), val("rrCamber"));
      updateToeWheel("flToeWheel", val("flToe"), "left", "front");
      updateToeWheel("frToeWheel", val("frToe"), "right", "front");
      updateToeWheel("rlToeWheel", val("rlToe"), "left", "rear");
      updateToeWheel("rrToeWheel", val("rrToe"), "right", "rear");
    }
    function setTotal(mainId, subId, value, axle) {
      $(mainId).innerHTML = Number.isFinite(value) ? smallToeUnit(toeText(value)) : "--";
      $(subId).innerHTML = smallToeUnit(toeConverted(value, axle));
    }
    function camberWheelAngle(value, side = "left") {
      if (!Number.isFinite(value) || value === 0) return "0deg";
      const direction = side === "right" ? 1 : -1;
      const convertedDeg = Math.atan(value / GAUGE_LENGTH) * 180 / Math.PI;
      const visualAngle = convertedDeg / MAX_CAMBER_CONVERTED_DEG * MAX_VISUAL_ANGLE;
      const angle = Math.max(-MAX_VISUAL_ANGLE, Math.min(MAX_VISUAL_ANGLE, visualAngle * direction));
      return `${angle.toFixed(1)}deg`;
    }
    function updateCamberAxle(axle, leftValue, rightValue) {
      const el = document.querySelector(`.${axle}-camber-axle`);
      if (!el) return;
      el.style.setProperty("--left-camber-angle", camberWheelAngle(leftValue, "left"));
      el.style.setProperty("--right-camber-angle", camberWheelAngle(rightValue, "right"));
    }
    function toeWheelAngle(value, side, axle) {
      if (!Number.isFinite(value) || value === 0) return "0deg";
      const direction = side === "right" ? -1 : 1;
      const convertedMm = value * tireDiameter(axle) / GAUGE_LENGTH;
      const visualAngle = convertedMm / MAX_TOE_CONVERTED_MM * MAX_VISUAL_ANGLE;
      const angle = Math.max(-MAX_VISUAL_ANGLE, Math.min(MAX_VISUAL_ANGLE, visualAngle * direction));
      return `${angle.toFixed(1)}deg`;
    }
    function updateToeWheel(id, value, side, axle) {
      const el = $(id);
      if (!el) return;
      el.style.transform = `rotate(${toeWheelAngle(value, side, axle)})`;
    }
    function openInput(key) {
      editingKey = key;
      const meta = fields[key];
      $("inputTitle").textContent = meta.label;
      $("inputLabel").textContent = `値 (${meta.unit})`;
      $("valueDir").classList.toggle("is-hidden", !(meta.toe || meta.camber));
      const currentValue = val(key);
      currentValueDir = Number.isFinite(currentValue) ? (currentValue < 0 ? "negative" : "positive") : (meta.camber ? "negative" : "positive");
      $("inputValue").value = Number.isFinite(val(key)) ? Math.abs(val(key)).toFixed(meta.caster ? 2 : 1) : "";
      updateValueDir(meta);
      $("inputDialog").showModal();
    }
    function updateValueDir(meta = fields[editingKey]) {
      const positiveLabel = meta?.camber ? "Pos" : "In";
      const negativeLabel = meta?.camber ? "Neg" : "Out";
      const positiveButton = document.querySelector('[data-dir="positive"]');
      const negativeButton = document.querySelector('[data-dir="negative"]');
      positiveButton.textContent = positiveLabel;
      negativeButton.textContent = negativeLabel;
      document.querySelectorAll("[data-dir]").forEach((button) => button.classList.toggle("active", button.dataset.dir === currentValueDir));
    }
    function applyInput() {
      const meta = fields[editingKey];
      const raw = Number($("inputValue").value);
      if (!Number.isFinite(raw)) return;
      const value = meta.toe || meta.camber ? (currentValueDir === "negative" ? -Math.abs(raw) : Math.abs(raw)) : raw;
      state.values[editingKey] = { value, meta: meta.caster ? "手入力" : "", at: new Date().toISOString() };
      $("inputDialog").close();
      saveDraft();
      render();
    }
    function saveDraft() {
      state.memo = $("memo").value;
      localStorage.setItem(DRAFT_KEY, JSON.stringify(JSON.parse(JSON.stringify(state))));
    }
    function restoreDraft() {
      const raw = localStorage.getItem(DRAFT_KEY);
      if (!raw) return;
      try {
        const draft = JSON.parse(raw);
        if (draft && typeof draft === "object") Object.assign(state, draft);
      } catch {
        localStorage.removeItem(DRAFT_KEY);
      }
    }
    function applyCasterResult() {
      const raw = localStorage.getItem("casterGaugeResult");
      if (!raw) return;
      let result;
      try { result = JSON.parse(raw); } catch { return; }
      if (!result.target || !fields[result.target] || !fields[result.target].caster) return;
      state.values[result.target] = {
        value: Number(result.casterDeg),
        meta: `品質 ${result.quality || "-"} ±95% ${Number(result.uncertainty95Deg || 0).toFixed(2)}° 位置 ${result.pointCount || "-"}`,
        at: result.at || new Date().toISOString()
      };
      localStorage.removeItem("casterGaugeResult");
      saveDraft();
      render();
    }
    function openSettings() {
      $("toeUnit").value = state.settings.toeUnit;
      ["front", "rear"].forEach((axle) => {
        $(axle + "Width").value = state.settings[axle].width;
        $(axle + "Aspect").value = state.settings[axle].aspect;
        $(axle + "Rim").value = state.settings[axle].rim;
      });
      updateDiameterReadouts();
      $("settingsDialog").showModal();
    }
    function tireDiameterFromInputs(axle) {
      const width = numericText($(axle + "Width").value, NaN);
      const aspect = numericText($(axle + "Aspect").value, NaN);
      const rim = numericText($(axle + "Rim").value, NaN);
      return width * aspect / 100 * 2 + rim * 25.4;
    }
    function updateDiameterReadouts() {
      ["front", "rear"].forEach((axle) => {
        const diameter = tireDiameterFromInputs(axle);
        $(`${axle}Diameter`).textContent = Number.isFinite(diameter) ? `${diameter.toFixed(1)} mm` : "--";
      });
    }
    function applySettings() {
      state.settings.toeUnit = $("toeUnit").value;
      ["front", "rear"].forEach((axle) => {
        state.settings[axle] = {
          width: numericText($(axle + "Width").value, 255),
          aspect: numericText($(axle + "Aspect").value, 35),
          rim: numericText($(axle + "Rim").value, 18)
        };
      });
      $("settingsDialog").close();
      saveDraft();
      updateDiameterReadouts();
      render();
    }
    function numericText(value, fallback) {
      const normalized = String(value)
        .replace(/[０-９]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
        .replace(/[^\d.]/g, "");
      const number = Number(normalized);
      return Number.isFinite(number) && number > 0 ? number : fallback;
    }
    function newRecord() {
      if (!confirm("現在の測定を破棄して新規開始しますか？ 車両設定とタイヤサイズは維持されます。")) return;
      state.id = crypto.randomUUID();
      state.measuredAt = new Date().toISOString();
      state.updatedAt = state.measuredAt;
      state.values = {};
      state.memo = MEMO_TEMPLATE;
      localStorage.removeItem(DRAFT_KEY);
      render();
    }
    function openDb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME, { keyPath: "id" });
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function saveRecord() {
      state.memo = $("memo").value;
      state.updatedAt = new Date().toISOString();
      const db = await openDb();
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).put(JSON.parse(JSON.stringify(state)));
      await new Promise((resolve, reject) => {
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      saveDraft();
      render();
      alert("測定結果を保存しました。");
    }
    async function allRecords() {
      const db = await openDb();
      const tx = db.transaction(STORE_NAME, "readonly");
      const req = tx.objectStore(STORE_NAME).getAll();
      return await new Promise((resolve, reject) => {
        req.onsuccess = () => resolve(req.result.sort((a, b) => b.measuredAt.localeCompare(a.measuredAt)));
        req.onerror = () => reject(req.error);
      });
    }
    async function showList() {
      const records = await allRecords();
      $("history").innerHTML = records.length ? records.map((record) => `
        <div class="history-row">
          <button class="btn" data-load="${record.id}">計測 ${new Date(record.measuredAt).toLocaleString("ja-JP")}<br><small>更新 ${new Date(record.updatedAt || record.measuredAt).toLocaleString("ja-JP")}</small><br><small>${escapeHtml((record.memo || "メモなし").slice(0, 20))}</small></button>
          <button class="btn" data-delete="${record.id}">削除</button>
        </div>
      `).join("") : "<p>保存済みの記録はありません。</p>";
      $("listDialog").showModal();
    }
    async function loadRecord(id) {
      const record = (await allRecords()).find((item) => item.id === id);
      if (!record) return;
      Object.assign(state, record);
      $("listDialog").close();
      render();
      saveDraft();
    }
    async function deleteRecord(id) {
      if (!confirm("この記録を削除しますか？")) return;
      const db = await openDb();
      const tx = db.transaction(STORE_NAME, "readwrite");
      tx.objectStore(STORE_NAME).delete(id);
      await new Promise((resolve, reject) => {
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      showList();
    }
    async function exportCsv() {
      const keys = Object.keys(fields);
      const rows = [["id", "measured_at", "updated_at", "memo", ...keys]];
      (await allRecords()).forEach((record) => rows.push([record.id, record.measuredAt, record.updatedAt || record.measuredAt, record.memo || "", ...keys.map((key) => record.values[key]?.value ?? "")]));
      const blob = new Blob([rows.map(csvRow).join("\n")], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `alignment-${new Date().toISOString().replace(/[:.]/g, "-")}.csv`;
      link.click();
      URL.revokeObjectURL(url);
    }
    async function importCsv(file) {
      if (!file) return;
      const text = await file.text();
      const rows = parseCsv(text).filter((row) => row.some((cell) => String(cell).trim() !== ""));
      if (rows.length < 2) {
        alert("読み込めるCSVデータがありません。");
        return;
      }
      const header = rows[0].map((cell) => String(cell).trim());
      const indexOf = (name) => header.indexOf(name);
      const idIndex = indexOf("id");
      const measuredIndex = indexOf("measured_at");
      const updatedIndex = indexOf("updated_at");
      const memoIndex = indexOf("memo");
      if (measuredIndex < 0) {
        alert("CSV形式が違います。measured_at列が必要です。");
        return;
      }
      const imported = rows.slice(1).map((row) => {
        const measuredAt = validIsoDate(row[measuredIndex]) || new Date().toISOString();
        const updatedAt = validIsoDate(row[updatedIndex]) || measuredAt;
        const values = {};
        Object.keys(fields).forEach((key) => {
          const valueIndex = indexOf(key);
          if (valueIndex < 0 || row[valueIndex] === "") return;
          const value = Number(row[valueIndex]);
          if (!Number.isFinite(value)) return;
          values[key] = {
            value,
            meta: fields[key].caster ? "CSV読込" : "",
            at: updatedAt
          };
        });
        return {
          id: row[idIndex] || crypto.randomUUID(),
          measuredAt,
          updatedAt,
          settings: JSON.parse(JSON.stringify(state.settings)),
          values,
          memo: memoIndex >= 0 ? row[memoIndex] || "" : ""
        };
      });
      const db = await openDb();
      const tx = db.transaction(STORE_NAME, "readwrite");
      imported.forEach((record) => tx.objectStore(STORE_NAME).put(record));
      await new Promise((resolve, reject) => {
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      alert(`${imported.length}件のCSVデータを読み込みました。`);
      showList();
    }
    function validIsoDate(value) {
      const text = String(value || "");
      return Number.isFinite(new Date(text).getTime()) ? text : "";
    }
    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;
      for (let i = 0; i < text.length; i += 1) {
        const ch = text[i];
        const next = text[i + 1];
        if (quoted) {
          if (ch === '"' && next === '"') {
            cell += '"';
            i += 1;
          } else if (ch === '"') {
            quoted = false;
          } else {
            cell += ch;
          }
        } else if (ch === '"') {
          quoted = true;
        } else if (ch === ",") {
          row.push(cell);
          cell = "";
        } else if (ch === "\n") {
          row.push(cell);
          rows.push(row);
          row = [];
          cell = "";
        } else if (ch !== "\r") {
          cell += ch;
        }
      }
      row.push(cell);
      rows.push(row);
      return rows;
    }
    function csvRow(values) {
      return values.map((value) => {
        const text = String(value ?? "");
        return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
      }).join(",");
    }
    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;" }[ch]));
    }

    document.querySelectorAll("[data-key]").forEach((button) => button.addEventListener("click", () => {
      const key = button.dataset.key;
      if (fields[key].caster) {
        localStorage.setItem("casterGaugeTarget", key);
        saveDraft();
        location.href = `caster.html?target=${encodeURIComponent(key)}`;
        return;
      }
      openInput(key);
    }));
    document.querySelectorAll("[data-dir]").forEach((button) => button.addEventListener("click", () => {
      currentValueDir = button.dataset.dir;
      updateValueDir();
    }));
    document.querySelectorAll("[data-nudge]").forEach((button) => button.addEventListener("click", () => {
      $("inputValue").value = ((Number($("inputValue").value) || 0) + Number(button.dataset.nudge)).toFixed(1);
    }));
    $("applyInput").addEventListener("click", applyInput);
    $("cancelInput").addEventListener("click", () => $("inputDialog").close());
    $("newBtn").addEventListener("click", newRecord);
    $("settingsBtn").addEventListener("click", openSettings);
    $("applySettings").addEventListener("click", applySettings);
    $("cancelSettings").addEventListener("click", () => $("settingsDialog").close());
    ["front", "rear"].forEach((axle) => {
      ["Width", "Aspect", "Rim"].forEach((part) => {
        $(axle + part).addEventListener("input", updateDiameterReadouts);
      });
    });
    $("memo").addEventListener("input", () => {
      state.memo = $("memo").value;
      saveDraft();
    });
    $("saveBtn").addEventListener("click", saveRecord);
    $("listBtn").addEventListener("click", showList);
    $("closeList").addEventListener("click", () => $("listDialog").close());
    $("importCsv").addEventListener("click", () => $("importCsvFile").click());
    $("importCsvFile").addEventListener("change", (event) => {
      importCsv(event.target.files[0]);
      event.target.value = "";
    });
    $("exportCsv").addEventListener("click", exportCsv);
    $("history").addEventListener("click", (event) => {
      const load = event.target.closest("[data-load]");
      const del = event.target.closest("[data-delete]");
      if (load) loadRecord(load.dataset.load);
      if (del) deleteRecord(del.dataset.delete);
    });
    window.addEventListener("pageshow", applyCasterResult);
    window.addEventListener("storage", applyCasterResult);
    restoreDraft();
    render();
    applyCasterResult();
  </script>
</body>
</html>
